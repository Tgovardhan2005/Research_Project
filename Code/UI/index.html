<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriVision — Two-Stage Edge Diagnostics</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

        :root {
            --bg: #0d1712;
            --panel: #132821;
            --panel-alt: #17332a;
            --line: #2c4a3d;
            --text: #e9ede3;
            --text-dim: #8fa79a;
            --accent: #8fe388;
            --accent-dim: #4f7a5a;
            --rust: #d97d3d;
            --rust-dim: #6b4a2e;
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                repeating-linear-gradient(115deg, rgba(143, 227, 136, 0.035) 0 1px, transparent 1px 58px),
                repeating-linear-gradient(65deg, rgba(143, 227, 136, 0.03) 0 1px, transparent 1px 58px),
                var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            justify-content: center;
            padding: 48px 20px;
        }

        .mono {
            font-family: 'IBM Plex Mono', monospace;
        }

        .site {
            width: 100%;
            max-width: 1120px;
        }

        header.masthead {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px 20px;
            padding-bottom: 28px;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--line);
        }

        .wordmark {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text);
        }

        .wordmark span {
            color: var(--accent);
        }

        .tagline {
            color: var(--text-dim);
            font-size: 14px;
            max-width: 320px;
            text-align: right;
            line-height: 1.5;
        }

        .layout {
            display: grid;
            grid-template-columns: 2.15fr 1fr;
            gap: 0;
        }

        .viewport-col {
            padding-right: 36px;
            border-right: 1px solid var(--line);
        }

        .index-col {
            padding-left: 36px;
        }

        /* ---------- Upload / dropzone ---------- */

        .intake {
            display: flex;
            gap: 12px;
            margin-bottom: 22px;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 16px;
            border: 1px solid var(--line);
            border-radius: 3px;
            background: var(--panel);
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        .file-label:hover {
            border-color: var(--accent-dim);
            color: var(--text);
        }

        .file-label svg {
            flex-shrink: 0;
            opacity: 0.8;
        }

        button.analyze {
            background: var(--accent);
            color: #0d1712;
            border: none;
            padding: 13px 22px;
            border-radius: 3px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            white-space: nowrap;
        }

        button.analyze:hover {
            background: #a6ecA0;
        }

        button.analyze:focus-visible,
        .file-label:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* ---------- Scanner viewport ---------- */

        .scanner {
            position: relative;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--panel);
            min-height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .scanner canvas {
            display: block;
            max-width: 100%;
            max-height: 420px;
        }

        .scanner-empty {
            color: var(--text-dim);
            font-size: 13px;
            text-align: center;
            padding: 40px;
        }

        .scan-line {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent) 20%, var(--accent) 80%, transparent);
            box-shadow: 0 0 12px 2px rgba(143, 227, 136, 0.6);
            opacity: 0;
            pointer-events: none;
        }

        .scanner.scanning .scan-line {
            opacity: 1;
            animation: sweep 1.15s ease-in-out infinite;
        }

        @keyframes sweep {
            0% {
                top: 0%;
            }

            50% {
                top: 98%;
            }

            100% {
                top: 0%;
            }
        }

        /* ---------- Pipeline stage indicator ---------- */

        .pipeline {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 22px 0 16px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .stage {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 5px 10px;
            border: 1px solid var(--line);
            border-radius: 20px;
            transition: border-color 0.25s ease, color 0.25s ease;
        }

        .stage .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--line);
            transition: background-color 0.25s ease, box-shadow 0.25s ease;
        }

        .stage.active {
            border-color: var(--accent-dim);
            color: var(--text);
        }

        .stage.active .dot {
            background: var(--accent);
            box-shadow: 0 0 6px rgba(143, 227, 136, 0.8);
        }

        .stage-track {
            flex: 1;
            height: 1px;
            background: var(--line);
            position: relative;
            max-width: 40px;
        }

        /* ---------- Diagnosis readout ---------- */

        .readout {
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--panel);
            padding: 20px 22px;
            transition: border-color 0.3s ease;
        }

        .readout.state-healthy {
            border-color: var(--accent-dim);
        }

        .readout.state-disease {
            border-color: var(--rust-dim);
        }

        .readout-label {
            margin: 0 0 6px;
            font-size: 12px;
            color: var(--text-dim);
        }

        #diagnosisName {
            margin: 0 0 4px;
            font-size: 22px;
            font-weight: 600;
            line-height: 1.3;
        }

        #diagnosisSub {
            margin: 0 0 16px;
            font-size: 13px;
            color: var(--text-dim);
        }

        .gauge-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .gauge-track {
            flex: 1;
            height: 6px;
            background: var(--panel-alt);
            border-radius: 3px;
            overflow: hidden;
        }

        .gauge-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.6s ease, background-color 0.3s ease;
        }

        .state-disease .gauge-fill {
            background: var(--rust);
        }

        #gaugeValue {
            font-size: 13px;
            color: var(--text-dim);
            min-width: 42px;
            text-align: right;
        }

        /* ---------- Species index (right column) ---------- */

        .index-col h3 {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 4px;
        }

        .index-count {
            font-size: 12px;
            color: var(--text-dim);
            margin: 0 0 16px;
        }

        .disease-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 560px;
            overflow-y: auto;
        }

        .disease-list li {
            display: flex;
            align-items: baseline;
            gap: 9px;
            padding: 9px 4px;
            border-bottom: 1px solid var(--line);
            font-size: 13px;
            color: var(--text-dim);
        }

        .disease-list li:last-child {
            border-bottom: none;
        }

        .disease-list .state-dot {
            flex-shrink: 0;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-top: 2px;
        }

        .disease-list .state-dot.healthy {
            background: var(--accent);
        }

        .disease-list .state-dot.disease {
            background: var(--rust);
        }

        .disease-list .crop {
            color: var(--text);
        }

        .disease-list::-webkit-scrollbar {
            width: 5px;
        }

        .disease-list::-webkit-scrollbar-thumb {
            background: var(--line);
            border-radius: 3px;
        }

        .disease-list::-webkit-scrollbar-thumb:hover {
            background: var(--accent-dim);
        }

        @media (max-width: 760px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .viewport-col {
                padding-right: 0;
                border-right: none;
                padding-bottom: 32px;
                margin-bottom: 32px;
                border-bottom: 1px solid var(--line);
            }

            .index-col {
                padding-left: 0;
            }

            .tagline {
                text-align: left;
            }

            .intake {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="site">

        <header class="masthead">
            <div class="wordmark">Agri<span>Vision</span></div>
            <p class="tagline">Two-stage edge diagnostics for row and orchard crops — locate the leaf, then classify
                what's on it.</p>
        </header>

        <div class="layout">

            <div class="viewport-col">

                <div class="intake">
                    <label class="file-label" for="imageInput" id="fileLabel">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M12 3v12" />
                            <path d="M7 8l5-5 5 5" />
                            <path d="M5 21h14" />
                        </svg>
                        <span id="fileLabelText">Add a leaf photo</span>
                    </label>
                    <input type="file" id="imageInput" accept="image/*">
                    <button class="analyze" onclick="uploadImage()">Analyze leaf</button>
                </div>

                <div class="scanner" id="scanner">
                    <div class="scan-line" id="scanLine"></div>
                    <canvas id="imageCanvas" style="display:none;"></canvas>
                    <p class="scanner-empty" id="scannerEmpty">No specimen loaded yet.<br>Choose a photo of a single
                        leaf to begin.</p>
                </div>

                <div class="pipeline">
                    <div class="stage" id="stage1"><span class="dot"></span>Locate</div>
                    <div class="stage-track"></div>
                    <div class="stage" id="stage2"><span class="dot"></span>Classify</div>
                </div>

                <div class="readout" id="readout">
                    <p class="readout-label">Diagnosis</p>
                    <h3 id="diagnosisName">Awaiting specimen</h3>
                    <p id="diagnosisSub" class="mono">—</p>
                    <div class="gauge-row">
                        <div class="gauge-track">
                            <div class="gauge-fill" id="gaugeFill"></div>
                        </div>
                        <span id="gaugeValue" class="mono">—</span>
                    </div>
                </div>

            </div>

            <div class="index-col">
                <h3>Supported diagnostics</h3>
                <p class="index-count mono" id="indexCount">— entries</p>
                <ul class="disease-list" id="diseaseListContainer"></ul>
            </div>

        </div>
    </div>

    <script>
        const CLASS_NAMES = [
            "Apple (Apple Scab)", "Apple (Black Rot)", "Apple (Cedar Apple Rust)", "Apple (Healthy)",
            "Blueberry (Healthy)", "Cherry (Powdery Mildew)", "Cherry (Healthy)",
            "Corn (Cercospora Leaf Spot)", "Corn (Common Rust)", "Corn (Northern Leaf Blight)", "Corn (Healthy)",
            "Grape (Black Rot)", "Grape (Esca / Black Measles)", "Grape (Leaf Blight)", "Grape (Healthy)",
            "Orange (Citrus Greening)", "Peach (Bacterial Spot)", "Peach (Healthy)",
            "Bell Pepper (Bacterial Spot)", "Bell Pepper (Healthy)", "Potato (Early Blight)",
            "Potato (Late Blight)", "Potato (Healthy)", "Raspberry (Healthy)", "Soybean (Healthy)",
            "Squash (Powdery Mildew)", "Strawberry (Leaf Scorch)", "Strawberry (Healthy)",
            "Tomato (Bacterial Spot)", "Tomato (Early Blight)", "Tomato (Late Blight)",
            "Tomato (Leaf Mold)", "Tomato (Septoria Leaf Spot)", "Tomato (Spider Mites)",
            "Tomato (Target Spot)", "Tomato (Yellow Leaf Curl Virus)", "Tomato (Mosaic Virus)",
            "Tomato (Healthy)"
        ];

        window.onload = function () {
            const listContainer = document.getElementById('diseaseListContainer');
            document.getElementById('indexCount').textContent = CLASS_NAMES.length + ' entries';
            CLASS_NAMES.forEach(entry => {
                const isHealthy = entry.includes('Healthy');
                const match = entry.match(/^(.+?)\s*\((.+)\)$/);
                const li = document.createElement('li');
                const dot = document.createElement('span');
                dot.className = 'state-dot ' + (isHealthy ? 'healthy' : 'disease');
                li.appendChild(dot);
                const label = document.createElement('span');
                if (match) {
                    label.innerHTML = '<span class="crop">' + match[1] + '</span> ' + match[2];
                } else {
                    label.textContent = entry;
                }
                li.appendChild(label);
                listContainer.appendChild(li);
            });
        };

        const imageInput = document.getElementById('imageInput');
        const fileLabelText = document.getElementById('fileLabelText');
        const canvas = document.getElementById('imageCanvas');
        const scannerEmpty = document.getElementById('scannerEmpty');
        const scanner = document.getElementById('scanner');

        imageInput.addEventListener('change', function () {
            if (!imageInput.files[0]) return;
            fileLabelText.textContent = imageInput.files[0].name;
            drawPreview(imageInput.files[0]);
            resetReadout();
        });

        function drawPreview(file) {
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = function () {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                canvas.style.display = 'block';
                scannerEmpty.style.display = 'none';
            };
            img.src = URL.createObjectURL(file);
        }

        function resetReadout() {
            document.getElementById('readout').className = 'readout';
            document.getElementById('diagnosisName').textContent = 'Ready to analyze';
            document.getElementById('diagnosisSub').textContent = '—';
            document.getElementById('gaugeFill').style.width = '0%';
            document.getElementById('gaugeValue').textContent = '—';
            setStage(0);
        }

        function setStage(n) {
            document.getElementById('stage1').classList.toggle('active', n >= 1);
            document.getElementById('stage2').classList.toggle('active', n >= 2);
        }

        async function uploadImage() {
            if (!imageInput.files[0]) {
                alert("Please select a leaf photo first.");
                return;
            }

            const readout = document.getElementById('readout');
            readout.className = 'readout';
            document.getElementById('diagnosisName').textContent = 'Scanning specimen…';
            document.getElementById('diagnosisSub').textContent = 'running two-stage pipeline';
            document.getElementById('gaugeFill').style.width = '0%';
            document.getElementById('gaugeValue').textContent = '—';
            scanner.classList.add('scanning');
            setStage(1);

            const formData = new FormData();
            formData.append("image", imageInput.files[0]);

            try {
                setTimeout(() => setStage(2), 600);

                const response = await fetch('http://127.0.0.1:5000/predict', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                scanner.classList.remove('scanning');

                if (data.error) {
                    readout.className = 'readout state-disease';
                    document.getElementById('diagnosisName').textContent = data.error;
                    document.getElementById('diagnosisSub').textContent = 'could not complete diagnosis';
                    setStage(0);
                    return;
                }

                const isHealthy = data.disease.includes("Healthy");
                readout.className = 'readout ' + (isHealthy ? 'state-healthy' : 'state-disease');
                document.getElementById('diagnosisName').textContent = data.disease;
                document.getElementById('diagnosisSub').textContent = isHealthy ? 'no treatment indicated' : 'treatment may be required';
                document.getElementById('gaugeFill').style.width = Math.round(data.confidence) + '%';
                document.getElementById('gaugeValue').textContent = Math.round(data.confidence) + '%';

                const speechText = "Diagnosis complete. The result is " + data.disease + " with " + Math.round(data.confidence) + " percent confidence.";
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(speechText));

                drawCanvas(imageInput.files[0], data.box);

            } catch (error) {
                scanner.classList.remove('scanning');
                readout.className = 'readout state-disease';
                document.getElementById('diagnosisName').textContent = 'Error connecting to backend';
                document.getElementById('diagnosisSub').textContent = 'check that the Flask server is running';
                setStage(0);
                console.error(error);
            }
        }

        function drawCanvas(file, box) {
            const ctx = canvas.getContext('2d');
            const img = new Image();

            img.onload = function () {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                canvas.style.display = 'block';
                scannerEmpty.style.display = 'none';

                ctx.strokeStyle = "#8fe388";
                ctx.lineWidth = Math.max(3, img.width * 0.006);
                ctx.strokeRect(box[0], box[1], box[2] - box[0], box[3] - box[1]);

                ctx.fillStyle = "rgba(143, 227, 136, 0.15)";
                ctx.fillRect(box[0], box[1], box[2] - box[0], box[3] - box[1]);
            };
            img.src = URL.createObjectURL(file);
        }
    </script>

</body>

</html>
